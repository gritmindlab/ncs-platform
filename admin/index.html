<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 · 그릿마인드랩 NCS 플랫폼</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMXRmSlgfchAMvNaLrh-VzvtsaT8zcF48",
    authDomain: "gritmindlab-cbt.firebaseapp.com",
    projectId: "gritmindlab-cbt",
    storageBucket: "gritmindlab-cbt.firebasestorage.app",
    messagingSenderId: "468296058186",
    appId: "1:468296058186:web:155e2dc31658bfb62d6db3",
    measurementId: "G-HNTVL8QJLE"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const screenLogin = document.getElementById('screen-login');
  const screenSelect = document.getElementById('screen-select');
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');
  const logoutBtn = document.getElementById('logout-btn');
  const userLabel = document.getElementById('user-label');

  onAuthStateChanged(auth, (user) => {
    if (user) {
      screenLogin.style.display = 'none';
      screenSelect.style.display = 'flex';
      userLabel.textContent = user.email || '관리자';
    } else {
      screenLogin.style.display = 'flex';
      screenSelect.style.display = 'none';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = '확인 중...';
    try {
      await signInWithEmailAndPassword(auth, emailInput.value.trim(), pwInput.value);
    } catch (err) {
      errorEl.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '로그인';
    }
  });

  logoutBtn.addEventListener('click', () => signOut(auth));
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f0f4f8;
    color: #1a2332;
    min-height: 100vh;
  }
  #screen-login, #screen-select {
    display: none;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 2.75rem 2.25rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(26,58,92,.08);
  }
  .card h1 {
    font-size: 1.3rem;
    margin-bottom: .4rem;
    text-align: center;
  }
  .card p.sub {
    color: #6b7684;
    font-size: .85rem;
    text-align: center;
    margin-bottom: 1.75rem;
  }
  label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: .4rem; color: #33415a; }
  input[type=email], input[type=password] {
    width: 100%;
    padding: .8rem .9rem;
    border: 1px solid #dbe2e8;
    border-radius: 10px;
    font: inherit;
    font-size: .95rem;
    margin-bottom: 1.1rem;
  }
  input:focus { outline: 2px solid #1a3a5c; border-color: #1a3a5c; }
  button[type=submit] {
    width: 100%;
    padding: .85rem;
    border: none;
    border-radius: 10px;
    background: #1a3a5c;
    color: #fff;
    font: inherit;
    font-weight: 800;
    font-size: .95rem;
    cursor: pointer;
  }
  button[type=submit]:disabled { opacity: .6; cursor: default; }
  .error { color: #e63946; font-size: .82rem; margin: -0.6rem 0 1rem; min-height: 1.1em; }

  #screen-select { flex-direction: column; gap: 28px; }
  .select-head { text-align: center; }
  .select-head h1 { font-size: 1.4rem; margin-bottom: .3rem; }
  .select-head p { color: #6b7684; font-size: .85rem; }
  .select-grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .select-card {
    width: 240px;
    background: #fff;
    border: 1px solid #dbe2e8;
    border-radius: 16px;
    padding: 2rem 1.5rem;
    text-align: center;
    text-decoration: none;
    color: inherit;
    transition: .15s;
    box-shadow: 0 8px 20px rgba(26,58,92,.05);
  }
  .select-card:hover {
    transform: translateY(-3px);
    border-color: #1a3a5c;
    box-shadow: 0 14px 28px rgba(26,58,92,.12);
  }
  .select-card .mark {
    width: 56px; height: 56px;
    margin: 0 auto 1rem;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.1rem; color: #fff;
  }
  .select-card.qbank .mark { background: #2f6fb8; }
  .select-card.cbt .mark { background: #1a3a5c; }
  .select-card h2 { font-size: 1.05rem; margin-bottom: .4rem; }
  .select-card p { font-size: .8rem; color: #6b7684; }

  .select-footer {
    text-align: center;
    font-size: .82rem;
    color: #8b96a8;
  }
  .select-footer b { color: #33415a; }
  #logout-btn {
    margin-left: 8px;
    background: none;
    border: none;
    color: #2f6fb8;
    font: inherit;
    font-size: .82rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div id="screen-login">
  <div class="card">
    <h1>관리자 로그인</h1>
    <p class="sub">관리자 계정으로 로그인해주세요.</p>
    <form id="login-form">
      <label for="email">이메일</label>
      <input type="email" id="email" required autocomplete="username" />
      <label for="password">비밀번호</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <div class="error" id="login-error"></div>
      <button type="submit">로그인</button>
    </form>
  </div>
</div>

<div id="screen-select">
  <div class="select-head">
    <h1>어디로 이동하시겠어요?</h1>
    <p>관리하실 페이지를 선택해주세요.</p>
  </div>
  <div class="select-grid">
    <a class="select-card qbank" href="https://gritmindlab.github.io/question-bank/">
      <div class="mark">Q</div>
      <h2>문제은행 관리자</h2>
      <p>NCS 문제 등록 · 검수 · 관리</p>
    </a>
    <a class="select-card cbt" href="https://gritmindlab.github.io/gritmindlab-cbt/cbtadmin.html">
      <div class="mark">C</div>
      <h2>CBT 관리자</h2>
      <p>시험 코드 · 응시 현황 관리</p>
    </a>
  </div>
  <div class="select-footer">
    <b id="user-label"></b>로 로그인됨<button id="logout-btn">로그아웃</button>
  </div>
</div>

</body>
</html>
