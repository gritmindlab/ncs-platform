name: 보도자료 자동 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12 * * *"

permissions:
  contents: write

concurrency:
  group: update-public-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 최신 보도자료 수집
        run: python scripts/update_news.py
      - name: 변경된 데이터 저장
        run: |
          git config user.name "gritmindlab-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 보도자료 자동 갱신"
          git push
